# The fixed rules of secret-scan.sh, on top of gitleaks' own (useDefault).
# Severity by tag: "block" stops the push and the gate; "warn" only warns, except with --strict (the gate of a tarball).
#
# secret-scan.sh does NOT hand this file to gitleaks as it is. Each run it appends to a temporary copy:
#   - [[rules]] itdfw-host-propio    a "warn" rule built from SECRET_SCAN_OWN_HOSTS (none when that is unset or empty)
#   - [[rules]] itdfw-ruta-propia    a "warn" rule built from SECRET_SCAN_OWN_PATHS (default: a home directory of a
#                                    person, /home/<name>/ or /Users/<name>/); /etc/itdfw/ never counts, see the README
#   - [allowlist]                    the "scan-ok" line marker below, plus SECRET_SCAN_ALLOW_PATHS when it is set
# so what is machine- or project-specific lives in the config of the one who runs it, not in this file.
# The rule ids keep their original names: the fingerprints of a reviewed false positive (secret-scan.ignore) contain them.
# A line that holds a made-up fixture is marked with "// scan-ok" or "# scan-ok" (or gitleaks' native "gitleaks:allow").
title = "itdfw secret-scan"

[extend]
useDefault = true

# ---------- credentials: BLOCK ----------

[[rules]]
id = "itdfw-mongo-url-credenciales"
description = "MongoDB URL with user and password"
regex = '''mongodb(\+srv)?://[^ "'`:/]+:[^ "'`@]+@'''
tags = ["block"]

[[rules]]
id = "itdfw-jwt"
description = "JWT or signed token (eyJ...)"
regex = '''eyJ[A-Za-z0-9_-]{15,}'''
tags = ["block"]

[[rules]]
id = "itdfw-sk-key"
description = "API key in the sk-... style"
regex = '''\bsk-[A-Za-z0-9]{16,}'''
tags = ["block"]

[[rules]]
id = "itdfw-facebook-token"
description = "Meta/Facebook token (EAA...)"
regex = '''EAA[A-Za-z0-9]{20,}'''
tags = ["block"]

[[rules]]
id = "itdfw-bearer"
description = "Bearer header with a token"
regex = '''Bearer [A-Za-z0-9._-]{12,}'''
tags = ["block"]

[[rules]]
id = "itdfw-env-default-secreto"
description = "environment variable that holds a secret, with a literal default"
regex = '''(PASSWORD|PASSWD|SECRET|TOKEN|API_?KEY|MONGO)[A-Z_]*\s*(\|\||\?\?)\s*["'`][^"'`]+'''
tags = ["block"]

[[rules]]
id = "itdfw-password-literal"
description = "literal password in the code"
regex = '''[Pp]assword["']?\s*[:=]\s*["'`][^"'`]{4,}["'`]'''
tags = ["block"]

[[rules]]
id = "itdfw-api-token-uuid"
description = "ITDFW API token (a 36-character UUID) assigned to token/key/secret or passed as an argument"
regex = '''(?i)(token|api_?key|access[_-]?key|secret|x-itd-access|--token|-t)["']?\s*[:=,\s]\s*["'`]?[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'''
tags = ["block"]

# ---------- files that are never pushed, by name: BLOCK ----------

[[rules]]
id = "itdfw-archivo-mcp-json"
description = ".mcp.json file (it carries the tokens of the MCP servers)"
path = '''(^|/)\.mcp\.json$'''
tags = ["block"]

[[rules]]
id = "itdfw-archivo-env"
description = ".env or .env.* file"
path = '''(^|/)\.env(\..+)?$'''
tags = ["block"]

[[rules]]
id = "itdfw-archivo-llave"
description = "key or certificate file (.pem, .pfx, .key, id_rsa*)"
path = '''(\.(pem|pfx|key)$)|((^|/)id_rsa[^/]*$)'''
tags = ["block"]
